# Render Blueprint: the Jobreach API and its background worker, both built from backend/Dockerfile.
#
# Create it in the Render dashboard: New > Blueprint > this repository. Render asks once for
# every value marked `sync: false` (the secrets in backend/.env); they are stored in Render,
# never in this repository. Each push to main redeploys both services.
#
# The worker runs every background task (sign-up builds, letters, matching) and the shared
# pool's schedule; it needs ~2 GB for LibreOffice's page checks. The web frontend is not here:
# it keeps running wherever it runs and points NEXT_PUBLIC_API_URL at the API's address.

services:
  - type: web
    name: jobreach-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    region: singapore
    plan: 0.5c-512mb
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: AZURE_OPENAI_ENDPOINT
        sync: false
      - key: AZURE_OPENAI_API_KEY
        sync: false
      - key: LLM_PROVIDER
        value: azure_openai
      - key: SUPABASE_URL
        value: https://pksaqwmgibkuyydlwdfb.supabase.co
      # Where the web app runs; add its deployed address here when it has one.
      - key: CORS_ORIGINS
        value: http://localhost:3000
      - key: DB_POOL_MAX
        value: "5"

  - type: worker
    name: jobreach-worker
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: python -m app.worker
    region: singapore
    plan: 1c-2g
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: AZURE_OPENAI_ENDPOINT
        sync: false
      - key: AZURE_OPENAI_API_KEY
        sync: false
      - key: LLM_PROVIDER
        value: azure_openai
      - key: SUPABASE_URL
        value: https://pksaqwmgibkuyydlwdfb.supabase.co
      - key: POOL_ENABLED
        value: "1"
      - key: DB_POOL_MAX
        value: "3"
