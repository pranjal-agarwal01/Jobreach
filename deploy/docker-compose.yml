# Jobreach on one server: the web app, the API, the worker, and Caddy in front.
#
#   https://jobreach.pranjalagarwal.me/        -> web    (Next.js)
#   https://jobreach.pranjalagarwal.me/api/... -> api    (FastAPI; the /api prefix is removed)
#   worker                                      (background tasks; no port)
#
# Caddy gets and renews the HTTPS certificate by itself. Only Caddy is reachable from outside;
# the others listen on the private network compose creates.
#
# Settings and secrets: deploy/.env (never committed). Compose reads it for the ${...} values
# below, and the API and worker get all of it as their environment.
#
#   docker compose -f deploy/docker-compose.yml up -d --build
name: jobreach

x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "3" }

services:
  api:
    build: ../backend
    image: jobreach-backend
    env_file: .env
    environment:
      PORT: "8000"
    restart: unless-stopped
    logging: *logging
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  worker:
    build: ../backend                # the same image as the API (the second build is all cache)
    image: jobreach-backend
    command: ["python", "-m", "app.worker"]
    env_file: .env
    restart: unless-stopped
    stop_grace_period: 60s           # let a running task finish
    logging: *logging

  web:
    build:
      context: ../frontend
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY}
        NEXT_PUBLIC_API_URL: https://${SITE_DOMAIN}/api
    image: jobreach-web
    restart: unless-stopped
    logging: *logging

  caddy:
    image: caddy:2
    depends_on: [api, web]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data             # the certificate: kept across restarts
      - caddy_config:/config
    restart: unless-stopped
    logging: *logging

volumes:
  caddy_data:
  caddy_config:
